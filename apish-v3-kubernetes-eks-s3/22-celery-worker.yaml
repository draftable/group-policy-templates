# =============================================================================
# Celery Worker Deployment
# =============================================================================
#
# ⚠️ NOTICE: This YAML file is deliberately templated and incomplete.
#    You MUST replace all placeholder values before applying to your cluster.
#
# Uses IRSA (IAM Roles for Service Accounts) for S3 access.
# Service account: draftable-s3-sa
#
# =============================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-worker
  namespace: draftable
  labels:
    app: celery-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: celery-worker
  template:
    metadata:
      labels:
        app: celery-worker
    spec:
      serviceAccountName: draftable-s3-sa
      containers:
        - name: celery-worker
          image: draftable/apish-web:latest
          command: ["celery", "-A", "apish", "worker", "-l", "info"]
          env:
            - name: ENV
              valueFrom:
                configMapKeyRef:
                  name: draftable-config
                  key: ENV
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: draftable-config
                  key: DB_HOST
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: draftable-config
                  key: DB_NAME
            - name: DB_USER
              valueFrom:
                configMapKeyRef:
                  name: draftable-config
                  key: DB_USER
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: draftable-secrets
                  key: db-password
            - name: AMQP_HOST
              valueFrom:
                configMapKeyRef:
                  name: draftable-config
                  key: AMQP_HOST
            - name: AMQP_USER
              valueFrom:
                configMapKeyRef:
                  name: draftable-config
                  key: AMQP_USER
            - name: AMQP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: draftable-secrets
                  key: amqp-password
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: draftable-config
                  key: REDIS_HOST
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: draftable-secrets
                  key: redis-password
            - name: DJANGO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: draftable-secrets
                  key: django-secret-key
            # S3 Configuration
            - name: FILE_STORAGE_TYPE
              valueFrom:
                configMapKeyRef:
                  name: draftable-config
                  key: FILE_STORAGE_TYPE
            - name: S3_STORAGE_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: draftable-config
                  key: S3_STORAGE_BUCKET
            - name: AWS_S3_REGION_NAME
              valueFrom:
                configMapKeyRef:
                  name: draftable-config
                  key: AWS_S3_REGION_NAME
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
