# =============================================================================
# AWS Credentials Secret for Compare Service
# =============================================================================
#
# ⚠️ NOTICE: This YAML file is deliberately templated and incomplete.
#    You MUST replace all placeholder values before applying to your cluster.
#
# ⚠️ CRITICAL: The Compare service (built with .NET) does NOT support IRSA!
#
# The Compare service is missing the AWSSDK.SecurityToken assembly required
# for AssumeRoleWithWebIdentity. It will fail with:
#   "Assembly AWSSDK.SecurityToken could not be found or loaded"
#
# Therefore, the Compare service requires explicit AWS credentials via
# environment variables: AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY
#
# =============================================================================
#
# To create this secret via command line (recommended):
#
# kubectl create secret generic aws-s3-credentials -n draftable \
#   --from-literal=AWS_ACCESS_KEY_ID='YOUR_ACCESS_KEY' \
#   --from-literal=AWS_SECRET_ACCESS_KEY='YOUR_SECRET_KEY'
#
# =============================================================================

apiVersion: v1
kind: Secret
metadata:
  name: aws-s3-credentials
  namespace: draftable
type: Opaque
stringData:
  # ⚠️ UPDATE: Replace with actual IAM user credentials
  AWS_ACCESS_KEY_ID: "REPLACE_WITH_ACCESS_KEY_ID"
  AWS_SECRET_ACCESS_KEY: "REPLACE_WITH_SECRET_ACCESS_KEY"
