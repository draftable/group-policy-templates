# =============================================================================
# Kubernetes Secrets for Draftable
# =============================================================================
#
# ⚠️ NOTICE: This YAML file is deliberately templated and incomplete.
#    You MUST replace all placeholder values before applying to your cluster.
#
# ⚠️ WARNING: This file contains placeholder values!
#    Replace all values before applying.
#
# To create secrets via command line (recommended):
#
# kubectl create secret generic draftable-secrets -n draftable \
#   --from-literal=db-password='YOUR_DB_PASSWORD' \
#   --from-literal=amqp-password='YOUR_AMQP_PASSWORD' \
#   --from-literal=redis-password='YOUR_REDIS_PASSWORD' \
#   --from-literal=django-secret-key='YOUR_64_CHAR_RANDOM_STRING' \
#   --from-literal=draftable-product-key='YOUR_PRODUCT_KEY'
#
# PowerShell (single line):
# kubectl create secret generic draftable-secrets -n draftable --from-literal=db-password='YourDbPass123!' --from-literal=amqp-password='YourAmqpPass123!' --from-literal=redis-password='YourRedisPass123!' --from-literal=django-secret-key='your-64-character-random-string-here-make-it-long-and-random!' --from-literal=draftable-product-key='your-draftable-license-key'
#
# =============================================================================

apiVersion: v1
kind: Secret
metadata:
  name: draftable-secrets
  namespace: draftable
type: Opaque
stringData:
  # Database password for PostgreSQL
  db-password: "REPLACE_WITH_SECURE_PASSWORD"
  
  # RabbitMQ password
  amqp-password: "REPLACE_WITH_SECURE_PASSWORD"
  
  # Redis password
  redis-password: "REPLACE_WITH_SECURE_PASSWORD"
  
  # Django secret key (64+ random alphanumeric characters)
  django-secret-key: "REPLACE_WITH_64_CHAR_RANDOM_STRING"
  
  # Draftable product license key
  draftable-product-key: "REPLACE_WITH_YOUR_LICENSE_KEY"
