# =============================================================================
# Service Account with IRSA for S3 Access
# =============================================================================
#
# ⚠️ NOTICE: This YAML file is deliberately templated and incomplete.
#    You MUST replace all placeholder values before applying to your cluster.
#
# This service account is used by Web, Celery Worker, and Celery Beat pods
# to access S3 via IAM Roles for Service Accounts (IRSA).
#
# ⚠️ IMPORTANT: Update the IAM role ARN before applying!
#
# ⚠️ WARNING: The Compare service does NOT support IRSA!
#    Compare uses the "default" service account with explicit AWS credentials.
#    See 04-aws-credentials-secret.yaml for Compare service credentials.
#
# Prerequisites:
# 1. OIDC provider configured for your EKS cluster
# 2. IAM role created with trust policy for this service account
# 3. IAM role has S3 access permissions attached
#
# =============================================================================

apiVersion: v1
kind: ServiceAccount
metadata:
  name: draftable-s3-sa
  namespace: draftable
  annotations:
    # ⚠️ UPDATE: Replace with your IAM role ARN
    eks.amazonaws.com/role-arn: arn:aws:iam::YOUR_ACCOUNT_ID:role/DraftableS3AccessRole
